name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-api.txt
      - run: pytest -q
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image (trains the model inside the build)
        run: docker build -t engagement-risk-api .
      - name: Smoke test the running container
        run: |
          docker run -d -p 8000:8000 --name api engagement-risk-api
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 2; done
          curl -sf http://localhost:8000/users/user_00001/risk
